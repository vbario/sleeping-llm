<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="900" height="320" fill="#0f172a" rx="12"/>

  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Fact Graduation: From Prompt to Weights</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">A fact must pass 2 consecutive sleep cycles to graduate (stage 0 &#x2192; 1 &#x2192; 2). Failure retreats 1 stage.</text>

  <!-- Stage boxes -->
  <rect x="60" y="85" width="220" height="100" rx="8" fill="#164e63" stroke="#06b6d4" stroke-width="2"/>
  <text x="170" y="112" text-anchor="middle" fill="#06b6d4" font-size="16" font-weight="bold">Stage 0</text>
  <text x="170" y="134" text-anchor="middle" fill="#e2e8f0" font-size="13">In System Prompt</text>
  <text x="170" y="154" text-anchor="middle" fill="#94a3b8" font-size="11">Instant recall via context</text>
  <text x="170" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">New, untrained</text>

  <rect x="340" y="85" width="220" height="100" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold">Stage 1</text>
  <text x="450" y="134" text-anchor="middle" fill="#e2e8f0" font-size="13">In Prompt + LoRA</text>
  <text x="450" y="154" text-anchor="middle" fill="#94a3b8" font-size="11">Passed 1 graduation test</text>
  <text x="450" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">LoRA absorbing</text>

  <rect x="620" y="85" width="220" height="100" rx="8" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">Stage 2: Graduated</text>
  <text x="730" y="134" text-anchor="middle" fill="#e2e8f0" font-size="13">REMOVED from prompt</text>
  <text x="730" y="154" text-anchor="middle" fill="#94a3b8" font-size="11">LoRA carries it in weights</text>
  <text x="730" y="172" text-anchor="middle" fill="#10b981" font-size="11">Frees context window</text>

  <!-- Forward arrows -->
  <line x1="280" y1="135" x2="338" y2="135" stroke="#10b981" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="560" y1="135" x2="618" y2="135" stroke="#10b981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Pass labels -->
  <text x="309" y="127" text-anchor="middle" fill="#10b981" font-size="11">PASS</text>
  <text x="589" y="127" text-anchor="middle" fill="#10b981" font-size="11">PASS</text>

  <!-- Fail arrows (back 1 stage, not to 0) -->
  <!-- Stage 1 fail → Stage 0 -->
  <path d="M450,185 C450,230 170,230 170,185" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arr-r)"/>
  <text x="310" y="228" text-anchor="middle" fill="#ef4444" font-size="10">FAIL: back to stage 0</text>

  <!-- Stage 2 fail (un-graduate) → Stage 1 -->
  <path d="M730,185 C730,250 450,250 450,185" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arr-r)"/>
  <text x="590" y="248" text-anchor="middle" fill="#ef4444" font-size="10">FAIL: back to stage 1</text>

  <!-- Test description -->
  <rect x="100" y="275" width="700" height="32" rx="6" fill="#1c2430" stroke="#475569" stroke-width="1"/>
  <text x="450" y="296" text-anchor="middle" fill="#94a3b8" font-size="12">
    Test: Remove fact from prompt. Ask a question. Fuzzy-match key tokens in the response (not exact substring).
  </text>
</svg>
