<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Sleeping LLM: Memory Architecture</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Three-tier memory system with LoRA weight consolidation</text>

  <!-- WAKE PHASE (left) -->
  <rect x="30" y="90" width="400" height="460" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="116" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">WAKE PHASE</text>

  <!-- User conversation -->
  <rect x="55" y="135" width="350" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="230" y="158" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Conversation</text>
  <text x="230" y="178" text-anchor="middle" fill="#64748b" font-size="11">User chats naturally with the model</text>

  <!-- Tier 0: System Prompt -->
  <rect x="55" y="210" width="350" height="70" rx="8" fill="#164e63" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="75" y="232" fill="#67e8f9" font-size="11" font-weight="bold">TIER 0</text>
  <text x="130" y="232" fill="#e2e8f0" font-size="13" font-weight="bold">System Prompt Injection</text>
  <text x="230" y="252" text-anchor="middle" fill="#94a3b8" font-size="11">Non-graduated facts injected into context</text>
  <text x="230" y="268" text-anchor="middle" fill="#06b6d4" font-size="11">Instant recall | Any phrasing | Token-limited</text>

  <!-- Tier 1: Fact Buffer -->
  <rect x="55" y="295" width="350" height="70" rx="8" fill="#1c2333" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="75" y="317" fill="#c4b5fd" font-size="11" font-weight="bold">TIER 1</text>
  <text x="130" y="317" fill="#e2e8f0" font-size="13" font-weight="bold">Fact Buffer (volatile RAM)</text>
  <text x="230" y="337" text-anchor="middle" fill="#94a3b8" font-size="11">Facts extracted per-turn, buffered until surprise gate fires</text>
  <text x="230" y="353" text-anchor="middle" fill="#8b5cf6" font-size="11">Crash = amnesia (by design) | Surprise threshold: 0.6</text>

  <!-- Tier 2: Fact Ledger -->
  <rect x="55" y="380" width="350" height="70" rx="8" fill="#1a2332" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="402" fill="#fcd34d" font-size="11" font-weight="bold">TIER 2</text>
  <text x="130" y="402" fill="#e2e8f0" font-size="13" font-weight="bold">Fact Ledger (persistent JSON)</text>
  <text x="230" y="422" text-anchor="middle" fill="#94a3b8" font-size="11">Source of truth for all learned facts (Q&amp;A pairs)</text>
  <text x="230" y="438" text-anchor="middle" fill="#f59e0b" font-size="11">Dedup | Priority | Stage tracking | Max 8 facts (3B)</text>

  <!-- Extraction arrow -->
  <line x1="230" y1="195" x2="230" y2="210" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="230" y1="280" x2="230" y2="295" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="230" y1="365" x2="230" y2="380" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Surprise gate label -->
  <rect x="260" y="278" width="100" height="18" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <text x="310" y="291" text-anchor="middle" fill="#c4b5fd" font-size="9">surprise &gt; 0.6</text>

  <!-- Fact extraction label -->
  <rect x="260" y="193" width="100" height="18" rx="4" fill="#3b82f6" opacity="0.3"/>
  <text x="310" y="206" text-anchor="middle" fill="#93c5fd" font-size="9">auto-extract</text>

  <!-- SLEEP PHASE (right) -->
  <rect x="470" y="90" width="400" height="460" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="670" y="116" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="bold">SLEEP PHASE</text>

  <!-- Sleep pipeline steps -->
  <rect x="495" y="135" width="350" height="40" rx="6" fill="#1c2430" stroke="#475569" stroke-width="1"/>
  <text x="510" y="158" fill="#94a3b8" font-size="11">1.</text>
  <text x="530" y="158" fill="#e2e8f0" font-size="12" font-weight="bold">Health Check</text>
  <text x="700" y="158" fill="#64748b" font-size="11">Baseline PPL measurement</text>

  <rect x="495" y="185" width="350" height="40" rx="6" fill="#1c2430" stroke="#475569" stroke-width="1"/>
  <text x="510" y="208" fill="#94a3b8" font-size="11">2.</text>
  <text x="530" y="208" fill="#e2e8f0" font-size="12" font-weight="bold">Curate</text>
  <text x="700" y="208" fill="#64748b" font-size="11">Extract new facts from sessions</text>

  <!-- Tier 3: LoRA -->
  <rect x="495" y="240" width="350" height="90" rx="8" fill="#1b2d1b" stroke="#10b981" stroke-width="1.5"/>
  <text x="515" y="262" fill="#6ee7b7" font-size="11" font-weight="bold">TIER 3</text>
  <text x="570" y="262" fill="#e2e8f0" font-size="13" font-weight="bold">LoRA Consolidation</text>
  <text x="670" y="282" text-anchor="middle" fill="#94a3b8" font-size="11">Augmented training: 4 question paraphrases per fact</text>
  <text x="670" y="298" text-anchor="middle" fill="#10b981" font-size="11">Priority-weighted | Fuse into base weights | ~60s</text>
  <text x="670" y="314" text-anchor="middle" fill="#6ee7b7" font-size="10">Rank 16 adapter across 8 target layers</text>

  <!-- Graduation -->
  <rect x="495" y="345" width="350" height="50" rx="6" fill="#1c2430" stroke="#eab308" stroke-width="1.5"/>
  <text x="510" y="368" fill="#94a3b8" font-size="11">4.</text>
  <text x="530" y="368" fill="#fcd34d" font-size="12" font-weight="bold">Graduation Test</text>
  <text x="670" y="383" text-anchor="middle" fill="#94a3b8" font-size="11">Withhold fact from prompt, ask question, check recall</text>

  <!-- Validation -->
  <rect x="495" y="410" width="350" height="40" rx="6" fill="#1c2430" stroke="#475569" stroke-width="1"/>
  <text x="510" y="433" fill="#94a3b8" font-size="11">5.</text>
  <text x="530" y="433" fill="#e2e8f0" font-size="12" font-weight="bold">Validate</text>
  <text x="700" y="433" fill="#64748b" font-size="11">PPL comparison, sanity check</text>

  <!-- Graduation result -->
  <rect x="495" y="465" width="170" height="35" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="580" y="487" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">PASS: Graduate</text>

  <rect x="675" y="465" width="170" height="35" rx="6" fill="#2d1b1b" stroke="#ef4444" stroke-width="1"/>
  <text x="760" y="487" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">FAIL: Stay in prompt</text>

  <!-- Cross-phase arrow -->
  <path d="M405,415 Q440,415 470,290" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- Graduate arrow back -->
  <path d="M495,482 Q460,510 230,450" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <text x="350" y="500" fill="#10b981" font-size="9" transform="rotate(-20, 350, 500)">graduated: removed from prompt</text>

  <!-- Fail arrow back -->
  <path d="M675,482 Q660,540 230,450" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <text x="420" y="545" fill="#ef4444" font-size="9">stays in prompt for next cycle</text>
</svg>
