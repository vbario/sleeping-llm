<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="350" fill="#0f172a" rx="12"/>

  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Biological Brain vs. Sleeping LLM</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Sleep consolidation: replaying memories to build long-term knowledge</text>

  <!-- Brain side -->
  <rect x="30" y="80" width="410" height="245" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="108" text-anchor="middle" fill="#f472b6" font-size="16" font-weight="bold">Biological Brain</text>

  <!-- Working memory -->
  <rect x="55" y="125" width="360" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="75" y="150" fill="#a5b4fc" font-size="13" font-weight="bold">Working Memory</text>
  <text x="350" y="150" text-anchor="end" fill="#94a3b8" font-size="11">~7 items, seconds</text>

  <!-- Short-term / Hippocampus -->
  <rect x="55" y="180" width="360" height="42" rx="6" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="75" y="205" fill="#c4b5fd" font-size="13" font-weight="bold">Short-term Memory</text>
  <text x="350" y="205" text-anchor="end" fill="#94a3b8" font-size="11">Hippocampus, hours-days</text>

  <!-- Long-term / Neocortex -->
  <rect x="55" y="235" width="360" height="42" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="260" fill="#93c5fd" font-size="13" font-weight="bold">Long-term Memory</text>
  <text x="350" y="260" text-anchor="end" fill="#94a3b8" font-size="11">Neocortex, permanent</text>

  <!-- Sleep label -->
  <rect x="100" y="290" width="270" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="235" y="308" text-anchor="middle" fill="#a5b4fc" font-size="11">Sleep: replay consolidates to long-term</text>

  <!-- LLM side -->
  <rect x="460" y="80" width="410" height="245" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="665" y="108" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">Sleeping LLM</text>

  <!-- System prompt -->
  <rect x="485" y="125" width="360" height="42" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
  <text x="505" y="150" fill="#67e8f9" font-size="13" font-weight="bold">System Prompt</text>
  <text x="780" y="150" text-anchor="end" fill="#94a3b8" font-size="11">~8 facts, instant recall</text>

  <!-- Fact Ledger -->
  <rect x="485" y="180" width="360" height="42" rx="6" fill="#1a2332" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="505" y="205" fill="#fcd34d" font-size="13" font-weight="bold">Fact Ledger</text>
  <text x="780" y="205" text-anchor="end" fill="#94a3b8" font-size="11">Persistent JSON, all facts</text>

  <!-- LoRA -->
  <rect x="485" y="235" width="360" height="42" rx="6" fill="#1b2d1b" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="260" fill="#6ee7b7" font-size="13" font-weight="bold">LoRA Weight Fusion</text>
  <text x="780" y="260" text-anchor="end" fill="#94a3b8" font-size="11">Fused into base weights</text>

  <!-- Sleep label -->
  <rect x="530" y="290" width="270" height="26" rx="13" fill="#0f2318" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="665" y="308" text-anchor="middle" fill="#6ee7b7" font-size="11">Sleep: LoRA trains + fuses into weights</text>

  <!-- Correspondence arrows -->
  <line x1="415" y1="146" x2="485" y2="146" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="415" y1="201" x2="485" y2="201" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="415" y1="256" x2="485" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="415" y1="303" x2="530" y2="303" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- = signs -->
  <text x="450" y="150" text-anchor="middle" fill="#64748b" font-size="14">=</text>
  <text x="450" y="205" text-anchor="middle" fill="#64748b" font-size="14">=</text>
  <text x="450" y="260" text-anchor="middle" fill="#64748b" font-size="14">=</text>
  <text x="473" y="307" text-anchor="middle" fill="#64748b" font-size="14">=</text>
</svg>
