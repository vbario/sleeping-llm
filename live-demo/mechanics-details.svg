<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#0f172a" rx="12"/>

  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">LoRA Consolidation Pipeline</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">How facts move from conversation to permanent weights</text>

  <!-- Step 1: Facts -->
  <rect x="30" y="90" width="190" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="125" y="115" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="bold">Fact Extraction</text>
  <text x="125" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Model extracts Q&amp;A</text>
  <text x="125" y="157" text-anchor="middle" fill="#94a3b8" font-size="11">pairs from USER messages</text>
  <text x="125" y="180" text-anchor="middle" fill="#67e8f9" font-size="10">User-grounding filter</text>
  <text x="125" y="196" text-anchor="middle" fill="#67e8f9" font-size="10">rejects model hallucinations</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="150" x2="248" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Augmentation -->
  <rect x="250" y="90" width="190" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="345" y="115" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">Data Augmentation</text>
  <text x="345" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">4 question paraphrases</text>
  <text x="345" y="157" text-anchor="middle" fill="#94a3b8" font-size="11">per fact for robustness</text>
  <text x="345" y="180" text-anchor="middle" fill="#c4b5fd" font-size="10">"Who is X?" "What do you</text>
  <text x="345" y="196" text-anchor="middle" fill="#c4b5fd" font-size="10">know about X?" ...</text>

  <!-- Arrow 2→3 -->
  <line x1="440" y1="150" x2="468" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: LoRA Training -->
  <rect x="470" y="90" width="190" height="120" rx="8" fill="#1b2d1b" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="115" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">LoRA Training</text>
  <text x="565" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Low-rank adapter</text>
  <text x="565" y="157" text-anchor="middle" fill="#94a3b8" font-size="11">rank 16, 8 target layers</text>
  <text x="565" y="180" text-anchor="middle" fill="#6ee7b7" font-size="10">40 iterations, ~60s</text>
  <text x="565" y="196" text-anchor="middle" fill="#6ee7b7" font-size="10">Priority-weighted loss</text>

  <!-- Arrow 3→4 -->
  <line x1="660" y1="150" x2="688" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Fusion -->
  <rect x="690" y="90" width="180" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="780" y="115" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Weight Fusion</text>
  <text x="780" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Adapter merged into</text>
  <text x="780" y="157" text-anchor="middle" fill="#94a3b8" font-size="11">base model weights</text>
  <text x="780" y="180" text-anchor="middle" fill="#fcd34d" font-size="10">Permanent change</text>
  <text x="780" y="196" text-anchor="middle" fill="#fcd34d" font-size="10">No adapter file needed</text>

  <!-- Bottom section: Before/After -->
  <rect x="30" y="240" width="410" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="268" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">Before Sleep</text>
  <text x="235" y="294" text-anchor="middle" fill="#94a3b8" font-size="12">Facts live only in system prompt (Tier 0)</text>
  <text x="235" y="314" text-anchor="middle" fill="#94a3b8" font-size="12">Clear the context = facts are gone</text>
  <text x="235" y="340" text-anchor="middle" fill="#ef4444" font-size="11">Model has NO intrinsic knowledge of the facts</text>
  <rect x="50" y="355" width="370" height="16" rx="4" fill="#2d1b1b"/>
  <rect x="50" y="355" width="0" height="16" rx="4" fill="#ef4444"/>
  <text x="235" y="367" text-anchor="middle" fill="#fca5a5" font-size="9">Weight knowledge: 0%</text>

  <rect x="460" y="240" width="410" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="665" y="268" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">After Sleep (Graduated)</text>
  <text x="665" y="294" text-anchor="middle" fill="#94a3b8" font-size="12">Facts absorbed into model weights via LoRA</text>
  <text x="665" y="314" text-anchor="middle" fill="#94a3b8" font-size="12">Clear the context = model still knows</text>
  <text x="665" y="340" text-anchor="middle" fill="#10b981" font-size="11">Fact removed from system prompt, frees context</text>
  <rect x="480" y="355" width="370" height="16" rx="4" fill="#052e16"/>
  <rect x="480" y="355" width="370" height="16" rx="4" fill="#10b981"/>
  <text x="665" y="367" text-anchor="middle" fill="#052e16" font-size="9" font-weight="bold">Weight knowledge: absorbed</text>
</svg>
